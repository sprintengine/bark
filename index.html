<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bark</title>
  <link rel="stylesheet" href="/src/pill.css" />
  <script type="module" src="/src/main.ts" defer></script>
</head>
<body data-pill="idle">
  <div class="window" id="app">
    <!-- The whole capsule is one button (start, finish, cancel, retry), so the
         parts inside it are drawn, not separate controls; pill.css shows the
         ones each state needs. -->
    <button
      class="pill"
      id="recordBtn"
      aria-label="Start recording"
      aria-pressed="false"
      title="Click to record"
    >
      <img class="brand-mark" src="/src/assets/brand/dog-tile.jpg" alt="" aria-hidden="true" />
      <span class="glyph" aria-hidden="true">
        <svg class="g-cancel" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
        <svg class="g-check" viewBox="0 0 24 24"><path d="M5 12.8l4.6 4.6L19 7.6"/></svg>
        <svg class="g-clipboard" viewBox="0 0 24 24"><path d="M9 4.5H7.5A1.5 1.5 0 0 0 6 6v13.5A1.5 1.5 0 0 0 7.5 21h9a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H15"/><rect x="9" y="3" width="6" height="3.2" rx="1"/><path d="M9.5 11h5M9.5 14.5h5"/></svg>
        <svg class="g-history" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.2 3.8v3.6h3.6"/><path d="M12 8v4.3l2.8 1.8"/></svg>
        <svg class="g-warning" viewBox="0 0 24 24"><path d="M10.3 4.4 2.9 17.5A2 2 0 0 0 4.6 20.5h14.8a2 2 0 0 0 1.7-3L13.7 4.4a2 2 0 0 0-3.4 0Z"/><path d="M12 9.5v4.2"/><path d="M12 17.1v.1"/></svg>
      </span>
      <span class="spinner" aria-hidden="true"></span>
      <span class="status-dot" id="statusDot" aria-hidden="true"></span>
      <span class="timer" id="timer" aria-label="Recording duration" aria-live="polite"></span>
      <span class="pill-label" id="statusLabel" role="status" aria-live="polite">Ready</span>
      <span class="wave" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </span>
      <kbd class="pill-hint" id="pillHint" aria-hidden="true"></kbd>
      <span class="finish" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5.5 12.6l4.3 4.3L18.5 8"/></svg>
      </span>
    </button>

    <button class="undo-polish-btn" id="undoPolishBtn" aria-label="Undo AI edit: copy the original transcript" title="Copy the original transcript">Undo</button>

    <button class="settings-btn" id="settingsBtn" aria-label="Open settings" title="Settings">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M9.6 3.7 10 2h4l.4 1.7a8.2 8.2 0 0 1 1.8.8l1.5-.9 2.8 2.8-.9 1.5c.3.6.6 1.2.8 1.8L22 10v4l-1.7.4a8.2 8.2 0 0 1-.8 1.8l.9 1.5-2.8 2.8-1.5-.9a8.2 8.2 0 0 1-1.8.8L14 22h-4l-.4-1.7a8.2 8.2 0 0 1-1.8-.8l-1.5.9-2.8-2.8.9-1.5a8.2 8.2 0 0 1-.8-1.8L2 14v-4l1.7-.4c.2-.6.4-1.2.8-1.8l-.9-1.5 2.8-2.8 1.5.9c.5-.3 1.1-.5 1.7-.7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      <span class="settings-event-badge" id="settingsEventBadge" aria-hidden="true"></span>
    </button>
  </div>
</body>
</html>
